<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Learn Python">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4B73"/>
      <stop offset="0.55" stop-color="#306998"/>
      <stop offset="1" stop-color="#24507A"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6B800"/>
      <stop offset="1" stop-color="#FFD43B"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="260" rx="20" fill="url(#blue)"/>
  <!-- accent bottom bar -->
  <rect x="0" y="248" width="1200" height="12" fill="url(#yellow)"/>

  <!-- code / prompt motif (right side) -->
  <g stroke="#FFE873" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <polyline points="985,92 1035,130 985,168"/>
    <line x1="1055" y1="172" x2="1120" y2="172"/>
  </g>
  <g fill="#FFD43B" opacity="0.35">
    <circle cx="1070" cy="70" r="6"/>
    <circle cx="1110" cy="100" r="5"/>
    <circle cx="1095" cy="200" r="6"/>
  </g>

  <!-- text -->
  <text x="64" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#FFE29A">PYTHON &#183; FUNDAMENTALS</text>
  <text x="60" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff">Learn Python</text>
  <text x="64" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#D6E6F2">Notes &#183; Exercises &#183; Quizzes &#183; Projects</text>
</svg>
